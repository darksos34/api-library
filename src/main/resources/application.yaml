##############################
###### GENERAL SETTINGS ######
##############################
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  profiles:
    active: ik
  application:
    name: ${SPRING_APPLICATION_NAME}
  config:
    import:
      - optional:file:.env[.properties]
      - application-database-dev.yaml
  web:
    error:
      include-message: always
      path: ${SPRING_WEB_ERROR_PATH}
  liquibase:
    enabled: true
    contexts: development
    drop-first: false
    clear-checksums: true
    change-log: classpath:db/db.changelog-master.xml
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true